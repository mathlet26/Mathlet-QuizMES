<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Quiz - Student PC</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .card {
            background: #1e293b;
            padding: 28px;
            border-radius: 14px;
            width: 100%;
            max-width: 520px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
        }
        input {
            width: 85%;
            padding: 12px 14px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            margin-bottom: 14px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 22px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { background: #1d4ed8; }
        .option-btn {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 14px 16px;
            background: #334155;
            text-align: left;
            font-size: 16px;
        }
        .option-btn:hover:not(:disabled) { background: #475569; }
        .option-btn:disabled { opacity: 0.55; cursor: not-allowed; }
        #timer {
            font-size: 24px;
            font-weight: 700;
            color: #facc15;
            margin-bottom: 12px;
        }
        #status-msg {
            margin-top: 14px;
            color: #38bdf8;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card" id="login-card">
        <h2>🎓 College Lab Quiz</h2>
        <p style="color:#cbd5e1;">തുടങ്ങാൻ നിങ്ങളുടെ പേര് അല്ലെങ്കിൽ Roll No നൽകുക</p>
        <input type="text" id="player-name" placeholder="ഉദാ: Rahul - CS101" maxlength="40">
        <br>
        <button onclick="joinQuiz()">Join Quiz</button>
    </div>

    <div class="card" id="quiz-card" style="display:none;">
        <div id="timer">Host തുടങ്ങാനായി കാത്തിരിക്കുന്നു...</div>
        <h3 id="question-text" style="line-height:1.5;">പ്രൊജക്ടർ സ്ക്രീൻ ശ്രദ്ധിക്കുക. ചോദ്യം വരുമ്പോൾ ഇവിടെ തെളിയും.</h3>
        <div id="options-container"></div>
        <div id="status-msg"></div>
    </div>

    <script>
        const socket = io();
        let playerName = "";
        let countdownInterval = null;

        function joinQuiz() {
            const val = document.getElementById('player-name').value.trim();
            if (!val) {
                alert("ദയവായി പേര് അല്ലെങ്കിൽ Roll No നൽകുക!");
                return;
            }
            playerName = val;
            socket.emit('join_quiz', { name: playerName });
            document.getElementById('login-card').style.display = 'none';
            document.getElementById('quiz-card').style.display = 'block';
        }

        socket.on('new_question', (data) => {
            clearInterval(countdownInterval);
            document.getElementById('status-msg').innerText = "";
            document.getElementById('question-text').innerText = `Q${data.index}/${data.total}: ${data.question}`;

            const container = document.getElementById('options-container');
            container.innerHTML = "";

            data.options.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => submitAnswer(opt);
                container.appendChild(btn);
            });

            let timeLeft = data.time_limit;
            const timerEl = document.getElementById('timer');
            timerEl.innerText = `⏱️ Time Left: ${timeLeft}s`;

            countdownInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    timerEl.innerText = "⏱️ Time Left: 0s";
                    disableOptions();
                    document.getElementById('status-msg').innerText = "സമയം കഴിഞ്ഞു!";
                } else {
                    timerEl.innerText = `⏱️ Time Left: ${timeLeft}s`;
                }
            }, 1000);
        });

        function submitAnswer(selectedOption) {
            disableOptions();
            socket.emit('submit_answer', { name: playerName, answer: selectedOption });
            document.getElementById('status-msg').innerText = "✅ ഉത്തരം രേഖപ്പെടുത്തി! സ്കോർ ബോർഡ് നോക്കുക.";
        }

        function disableOptions() {
            document.querySelectorAll('.option-btn').forEach((btn) => {
                btn.disabled = true;
            });
        }

        socket.on('quiz_over', () => {
            clearInterval(countdownInterval);
            document.getElementById('timer').innerText = "🎉 Quiz Completed!";
            document.getElementById('question-text').innerText = "നന്ദി! അന്തിമ ഫലം പ്രൊജക്ടർ സ്ക്രീനിൽ കാണാം.";
            document.getElementById('options-container').innerHTML = "";
        });
    </script>
</body>
</html>
